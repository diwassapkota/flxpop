# When the `dev-fonepay-mock` profile is active, override the Fonepay base URL
# to point at the in-process WireMock started by DevFonepayMock on port 8089.
# Combine with the `dev` profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev,dev-fonepay-mock
flexpop:
  gateways:
    fonepay:
      base-url: http://localhost:8089
      # Override the placeholder creds. The dev mock accepts any value;
      # the engine still signs requests, so we need a valid PKCS8 key.
      # This is a one-time-generated THROWAWAY key — safe to commit because
      # it isn't registered with real Fonepay.
      login-username: dev-mock-user
      login-password: dev-mock-pass
      terminal-id: DEV-MOCK-TERMINAL
      private-key-base64-pkcs8: 
