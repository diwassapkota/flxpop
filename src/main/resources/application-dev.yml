spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${FLXPOP_DB_NAME:flxpop}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: flxpop-hikari

flxpop:
  gateways:
    fonepay:
      terminal-id: ${FONEPAY_TERMINAL_ID:STUB-TERMINAL-ID}
      login-username: ${FONEPAY_USERNAME:STUB-USERNAME-CONFIGURE-ME}
      login-password: ${FONEPAY_PASSWORD:STUB-PASSWORD-CONFIGURE-ME}
      private-key-base64-pkcs8: ${FONEPAY_PRIVATE_KEY_B64:}
      base-url: ${FONEPAY_BASE_URL:https://dev-external-gateway-new.fonepay.com/merchantThirdparty}
      webhook-secret: ${FONEPAY_WEBHOOK_SECRET:dev-fonepay-webhook-secret}
      # Status-API polling is OFF for now: thirdPartyDynamicQrGetStatus returns
      # 409 "Unauthorized request" for this merchant (not yet entitled), so every
      # poll was a wasted 409. The widget settles from the real-time payment
      # websocket instead. Re-enable (set both back to ~5000) once Fonepay
      # enables the status API, or replace with a webhook.
      poll-interval-ms: ${FONEPAY_POLL_INTERVAL_MS:86400000}
      poll-initial-delay-ms: ${FONEPAY_POLL_INITIAL_DELAY_MS:86400000}
    esewa:
      # Defaults are eSewa's published UAT/sandbox values (product code EPAYTEST
      # + the public test secret) — works out of the box against rc-epay.esewa.
      # engine-base-url MUST be reachable by the shopper's browser AND by eSewa's
      # redirect; for local dev that's localhost:8080.
      merchant-code: ${ESEWA_MERCHANT_CODE:EPAYTEST}
      secret-key: ${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
      form-url: ${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      status-url: ${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
      engine-base-url: ${ESEWA_ENGINE_BASE_URL:http://localhost:8080}
      # After settling, eSewa's callback 302s the browser back here (the merchant
      # checkout) with ?flxpop_txn=…&flxpop_result=… so the page shows the result.
      return-url: ${ESEWA_RETURN_URL:http://localhost:5173/demo.html}
      poll-interval-ms: ${ESEWA_POLL_INTERVAL_MS:5000}

logging:
  level:
    com.flxpop: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
