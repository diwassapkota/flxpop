spring:
  datasource:
    # Tests use a dedicated `flexpop_test` schema on your local MySQL so they
    # never touch the dev `flexpop` data. Override via env vars:
    #   DB_HOST, DB_PORT, TEST_DB_NAME, DB_USER, DB_PASSWORD
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${TEST_DB_NAME:flexpop_test}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

# Don't let the scheduled outbound worker or Fonepay poller fire during tests —
# we exercise the logic directly. Tests that want to drive the poller call
# `poller.tick()` after setting up WireMock stubs.
flexpop:
  webhook:
    poll-interval-ms: 86400000
  gateways:
    fonepay:
      poll-interval-ms: 86400000
      poll-initial-delay-ms: 86400000
    esewa:
      poll-interval-ms: 86400000
      poll-initial-delay-ms: 86400000

logging:
  level:
    com.flexpop: INFO
    com.zaxxer.hikari: WARN
