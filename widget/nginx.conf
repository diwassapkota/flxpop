server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config + HTML must never be cached (config.js carries the engine URL).
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    # Content-hashed build assets can be cached aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `/` serves the widget (index.html); `/demo.html` the merchant demo.
    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
